[project]
name = "xiaosu-backend"
version = "0.1.0"
description = "公司内部 AI 助手「小苏」后端 - RAG 知识库 + Agent 工具调用"
requires-python = ">=3.12"
dependencies = [
    # FastAPI & Server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.18",
    # Database
    "sqlalchemy>=2.0.34",
    "pymysql>=1.1.1",
    "aiomysql>=0.2.0",
    # Authentication
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.0",
    # LLM & RAG
    "langchain>=0.3.14",
    "langchain-text-splitters>=0.3.5",
    "chromadb>=0.5.23",
    "httpx>=0.27.0",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
    "sentence-transformers>=3.0.0",
    # Redis Caching
    "redis>=5.0.0",
    # RAGAS Evaluation
    "ragas>=0.2.0",
    "datasets>=2.14.0",
    # Document Parsing
    "pdfplumber>=0.11.4",
    "python-docx>=1.1.2",
    "beautifulsoup4>=4.12.3",
    # Utils
    "python-dotenv>=1.0.1",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "aiofiles>=24.1.0",
    "lark-oapi>=1.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
# 国内镜像加速
[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
